name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Linux: service containers need Docker, which hosted macOS runners do not have. Nothing in
    # this job touches a simulator.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routeshot_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/routeshot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test -- --coverage
      - run: pnpm build
      - run: pnpm --filter routeshot exec publint
      # ESM-only package: node10 and CommonJS resolution are out of scope by design.
      - run: pnpm --filter routeshot exec attw --pack . --profile esm-only

  dogfood:
    # Runs routeshot on its own example app. Manual until the simulator job is proven stable on hosted runners.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available --json | node -e "
            const devices = Object.entries(JSON.parse(require('fs').readFileSync(0, 'utf8')).devices)
              .filter(([runtime]) => runtime.includes('iOS'))
              .flatMap(([, list]) => list);
            const iphone = devices.find((device) => device.name.includes('iPhone'));
            if (!iphone) { console.error('no iPhone simulator on this runner'); process.exit(1); }
            console.log(iphone.udid);
          ")
          xcrun simctl boot "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build example app
        working-directory: example
        env:
          # CocoaPods crashes on a non-UTF-8 locale, and `expo prebuild` still exits 0 when it does.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios
          # `run:ios` installs the app and then opens it through the dev-client launcher URL. On a
          # hosted runner that open times out after the install already succeeded, so the install
          # is what gets checked, not the launch.
          npx expo run:ios --configuration Release --no-bundler --device "$SIM_UDID" \
            || echo "expo run:ios exited non-zero after the build; checking the install instead"
          xcrun simctl get_app_container "$SIM_UDID" dev.routeshot.example
      - name: Capture
        working-directory: example
        # A Release build embeds its bundle, so there is no Metro to boot from.
        run: pnpm exec routeshot capture --no-dev-client --label ci --json > capture.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routeshot-run
          path: example/.routeshot
