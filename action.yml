name: routeshot
description: Screenshot every expo-router route on the iOS Simulator, diff against a baseline, and comment on the PR.
author: Cole Blender
branding:
  icon: camera
  color: purple
inputs:
  project-root:
    description: Directory of the Expo app (contains app.json and, optionally, routeshot.config).
    required: false
    default: .
  server-url:
    description: Base URL of the routeshot report server.
    required: true
  server-token:
    description: Bearer token for the report server.
    required: true
  label:
    description: Run label. Defaults to the branch name.
    required: false
    default: ''
  baseline:
    description: Baseline run id or branch name on the server. Defaults to the repository's default branch.
    required: false
    default: ''
  update-url:
    description: 'EAS update manifest URL to load before capturing: either https://u.expo.dev/update/<updateId> (the manifestPermalink from `eas update --json`) or https://u.expo.dev/<projectId>/group/<groupId>.'
    required: false
    default: ''
  changed-since:
    description: 'Git ref to diff against (e.g. origin/main). Only screens whose route file, layouts or imports changed are captured. Needs `fetch-depth: 0` on the checkout so the merge base exists.'
    required: false
    default: ''
  device:
    description: Simulator device name.
    required: false
    default: ''
  dev-client:
    description: '"true" to boot a development build from the dev server, "false" for a release build. Defaults to detection from package.json.'
    required: false
    default: ''
  fail-on-change:
    description: Fail the job when any route changed above the threshold. The report and comment are produced either way.
    required: false
    default: 'false'
  github-token:
    description: Token used to comment on the pull request.
    required: false
    default: ${{ github.token }}
outputs:
  report-url:
    description: URL of the hosted report.
    value: ${{ steps.compare.outputs.report-url }}
  run-id:
    description: Id of the uploaded run.
    value: ${{ steps.capture.outputs.run-id }}
runs:
  using: composite
  steps:
    - name: Build routeshot
      # Built from the action's own checkout, so the action works before and after any npm publish.
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile --filter routeshot
        pnpm --filter routeshot build
        echo "ROUTESHOT_BIN=${GITHUB_ACTION_PATH}/packages/routeshot/dist/cli.js" >> "$GITHUB_ENV"
    - name: Capture and upload
      id: capture
      shell: bash
      working-directory: ${{ inputs.project-root }}
      # Inputs reach the shell as environment variables, never as template expansions inside the
      # script: a branch name is attacker-controlled on a pull request from a fork.
      env:
        ROUTESHOT_SERVER_URL: ${{ inputs.server-url }}
        ROUTESHOT_SERVER_TOKEN: ${{ inputs.server-token }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_UPDATE_URL: ${{ inputs.update-url }}
        INPUT_CHANGED_SINCE: ${{ inputs.changed-since }}
        INPUT_DEVICE: ${{ inputs.device }}
        INPUT_DEV_CLIENT: ${{ inputs.dev-client }}
        DEFAULT_LABEL: ${{ github.head_ref || github.ref_name }}
      run: |
        label="${INPUT_LABEL:-$DEFAULT_LABEL}"
        args=(capture --label "$label" --upload --json)
        if [ -n "$INPUT_UPDATE_URL" ]; then args+=(--update-url "$INPUT_UPDATE_URL"); fi
        if [ -n "$INPUT_CHANGED_SINCE" ]; then args+=(--changed-since "$INPUT_CHANGED_SINCE"); fi
        if [ -n "$INPUT_DEVICE" ]; then args+=(--device "$INPUT_DEVICE"); fi
        if [ "$INPUT_DEV_CLIENT" = "true" ]; then args+=(--dev-client); fi
        if [ "$INPUT_DEV_CLIENT" = "false" ]; then args+=(--no-dev-client); fi
        node "$ROUTESHOT_BIN" "${args[@]}" > capture.json
        run_id=$(node -p "require('./capture.json').upload.id")
        # A run id is a server-issued opaque token; anything else is a broken server, not an input.
        if ! [[ "$run_id" =~ ^[A-Za-z0-9_-]+$ ]]; then echo "unexpected run id: $run_id" >&2; exit 1; fi
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
    - name: Compare
      id: compare
      shell: bash
      working-directory: ${{ inputs.project-root }}
      env:
        ROUTESHOT_SERVER_URL: ${{ inputs.server-url }}
        ROUTESHOT_SERVER_TOKEN: ${{ inputs.server-token }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
        DEFAULT_BASELINE: ${{ github.event.repository.default_branch }}
        RUN_ID: ${{ steps.capture.outputs.run-id }}
      run: |
        baseline="${INPUT_BASELINE:-$DEFAULT_BASELINE}"
        args=(compare "$baseline" "$RUN_ID" --remote --json)
        if [ "$INPUT_FAIL_ON_CHANGE" != "true" ]; then args+=(--no-fail); fi
        status=0
        node "$ROUTESHOT_BIN" "${args[@]}" > compare.json || status=$?
        echo "report-url=$(node -p "require('./compare.json').url")" >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Comment
      if: always() && github.event_name == 'pull_request' && steps.capture.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PROJECT_ROOT: ${{ inputs.project-root }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.PROJECT_ROOT, 'compare.json'), 'utf8'));
          const s = report.summary;
          const verdicts = report.verdicts ?? [];
          const flagged = verdicts.filter((v) => v.level !== 'green');
          const badge = { red: '🔴', yellow: '🟡', unverified: '⚪' };
          const lines = [
            `**routeshot**: ${s.total} screens. ${s.unchanged} unchanged, ${s.changed} changed, ${s.added} added, ${s.removed} removed, ${s.unverified} unverified.`,
            '',
            ...flagged.map((v) => `${badge[v.level]} \`${v.route}\` ${v.caption}`),
            flagged.length ? '' : (s.changed ? 'Changed screens look fine.' : 'Nothing changed.'),
            `[Open the report](${report.url})`,
          ];
          const marker = '<!-- routeshot -->';
          const body = `${marker}\n${lines.join('\n')}`;
          const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
          const existing = comments.find((c) => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
          }
